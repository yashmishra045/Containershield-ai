
name: ContainerShield AI DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csai-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: csai-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # 1. Scan repository for leaked secrets
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build and validate the frontend
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # 3. Build and scan the backend Docker image
  backend-security:
    name: Backend Security Scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: |
          docker build \
            -t csai-backend:${{ github.sha }} \
            ./backend

      # Trivy reports findings but does not fail on vulnerability
      # findings in this diagnostic configuration.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: csai-backend:${{ github.sha }}
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Grype remains a blocking security gate.
      - name: Scan image with Grype
        uses: anchore/scan-action@v7
        with:
          image: csai-backend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      # Generate a Software Bill of Materials.
      - name: Generate backend SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: csai-backend:${{ github.sha }}
          format: spdx-json
          output-file: backend-sbom.spdx.json

      # Preserve reports even when a security step fails.
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csai-security-reports
          path: |
            trivy-results.json
            backend-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14

      # Transfer the scanned image to the publishing job.
      - name: Save scanned Docker image
        if: success()
        run: |
          docker save csai-backend:${{ github.sha }} \
            -o csai-backend-image.tar

      - name: Upload scanned Docker image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: csai-backend-image
          path: csai-backend-image.tar
          retention-days: 1

  # 4. Publish only after all required checks pass
  publish-backend:
    name: Publish Backend to GHCR
    runs-on: ubuntu-latest

    needs:
      - secrets-scan
      - frontend-build
      - backend-security

    # Do not publish from pull requests or forked PRs.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: csai-backend-image
          path: .

      - name: Load scanned Docker image
        run: docker load -i csai-backend-image.tar

      - name: Set lowercase GHCR image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag backend image
        run: |
          docker tag \
            csai-backend:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:${{ github.sha }}

          docker tag \
            csai-backend:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:latest

      - name: Push backend image to GHCR
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:latest
