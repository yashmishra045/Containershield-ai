services:
  db:
    image: postgres:16
    container_name: containershield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: containershield
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: containershield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U containershield -d containershield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: containershield-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://containershield:devpassword@db:5432/containershield_db
    ports:
      - "8000:8000"
    # Needed so the backend container can run `docker` commands (Gitleaks step)
    # against the HOST's Docker daemon.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata: